# Boot runtime configuration
#
# This file is intentionally small while physical-firmware qualification is
# still in progress. Boot owns this filename and reads it from the directory
# containing the running EFI application.

# Optional physical-firmware diagnostics: uncomment only for a controlled
# one-time EFI driver test. Shows stage boundaries on the firmware console and
# a RAM-only summary on Boot's graphical menu. Does not create log files or
# write NVRAM. Disable again after the test.
# driver_diagnostics true

# Seconds to wait before starting the default selection.
timeout 20

# Boot opens this directory relative to its own executable, then reads each
# icon through that directory handle.
icons_dir icons

# Canonical Infiltrator firmware presentation generated from Libraries' shared
# design contract and the product-owned InfiltratorOS artwork.
banner boot-banner.png
selection_big boot-selection-big.png
selection_small boot-selection-small.png

# Canonical UI typography. Boot's generated MB Corpo S atlas preserves the
# source face's native advances and baseline bearings rather than approximating
# them from fixed bitmap cells.
font mb-corpo-s-regular.png

# Prefer direct Linux EFI-stub kernels when Boot can read the Linux filesystem.
# Keep multiple installed kernels folded behind the current kernel, and prefer
# that direct kernel entry over an ESP-resident GRUB fallback.
scan_all_linux_kernels true
fold_linux_kernels true
default_selection vmlinuz

# Keep UEFI graphics active when handing off to a direct Linux EFI-stub kernel.
# Without this, Boot switches to its text-mode status screen before Mint starts.
use_graphics_for linux

# Keep normal boot calm: volume badges and inherited instructional hint lines
# are unnecessary on the primary graphical selection surface.
hideui badges hints

# Keep the development-preview utility row limited to safe platform actions.
# Installation is owned by Setup, and Boot testing must not expose inherited
# install/boot-order mutation surfaces.
showtools reboot,shutdown,firmware

# During removable-media testing, keep Boot's own state off motherboard NVRAM.
use_nvram false

# Device-specific Linux entries belong here, not on the kernel's filesystem.
# Example: select a kernel source volume independently of the Linux root.
# menuentry "Linux" {
#     volume REPLACE_WITH_BOOT_SOURCE_PARTUUID
#     loader \\boot\\vmlinuz
#     initrd \\boot\\initrd.img
#     options "root=UUID=REPLACE_WITH_LINUX_ROOT_UUID ro"
# }
# An absent/unreadable volume disables the entry rather than loading from ESP.
