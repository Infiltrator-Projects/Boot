# Boot runtime configuration
#
# This file is intentionally small while physical-firmware qualification is
# still in progress. Boot owns this filename and reads it from the directory
# containing the running EFI application.

# Seconds to wait before starting the default selection.
timeout 20

# Boot firmware UI typography. The release ships this verified MB Corpo S
# bitmap atlas beside the EFI application.
font mb-corpo-s-regular.png

# During removable-media testing, keep Boot's own state off motherboard NVRAM.
use_nvram false
