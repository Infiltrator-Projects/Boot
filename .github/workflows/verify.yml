name: Verify Boot release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boot-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnu-efi gcc make binutils curl xz-utils python3-pil
      - name: Verify pinned source and full GNU-EFI build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/vendor-infiltratorfs.sh --check
          bash -n scripts/build-gnuefi.sh
          bash -n scripts/build-mb-fonts.sh
          bash -n scripts/build-icons.sh
          bash -n scripts/build-theme.sh
          bash -n scripts/build-uefi-bundle.sh
          bash scripts/build-gnuefi.sh
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -q '#define CONFIG_FILE_NAME[[:space:]]*L"boot.conf"' refind/config.h
          grep -q '^icons_dir \.$' boot.conf
          grep -q '^banner boot-banner\.png$' boot.conf
          grep -q '^selection_big boot-selection-big\.png$' boot.conf
          grep -q '^selection_small boot-selection-small\.png$' boot.conf
          grep -q '^font mb-corpo-s-regular\.png$' boot.conf
          grep -q '^scan_all_linux_kernels true$' boot.conf
          grep -q '^fold_linux_kernels true$' boot.conf
          grep -q '^default_selection vmlinuz$' boot.conf
          grep -q '^use_graphics_for linux$' boot.conf
          # Icon cold-start recovery and RAM-only diagnostics must stay bounded.
          grep -q 'BOOT_ICON_MAX_RETRIES 2' libeg/image.c
          grep -q 'egIsTransientIconReadFailure(Status)' libeg/image.c
          grep -q 'BufferSize != (UINTN)ReadSize' libeg/image.c
          grep -q 'egGetIconDiagnosticText()' refind/menu.c
          grep -q 'Name && GlobalConfig.UseNvram' refind/main.c
          grep -q 'return EFI_WRITE_PROTECTED; // never redirect state writes' refind/lib.c
          # Volatile pre-menu timing diagnostics must remain separate from ESP writes.
          grep -q 'BootGetStartupTimingLine' refind/main.c
          grep -q 'BootMarkStartup(7)' refind/main.c
          grep -q 'BootMarkStartup(6)' refind/main.c
          grep -q 'BootGetStartupTimingLine(Line)' refind/menu.c
          grep -q 'RT->GetTime' refind/main.c
          python3 - <<'PY_BOOT_DRIVER_BINDING'
          from pathlib import Path
          s = Path('refind/driver_support.c').read_text()
          assert 'static VOID ConnectFilesystemBlockDevices(VOID)' in s
          targeted = s[s.index('static VOID ConnectFilesystemBlockDevices(VOID)'):
                       s.index('} // static VOID ConnectFilesystemBlockDevices()')]
          assert '!BlockIo->Media->MediaPresent' in targeted
          assert '!BlockIo->Media->LogicalPartition' not in targeted
          assert '&gMyEfiSimpleFileSystemProtocolGuid' in targeted
          assert 'if (!EFI_ERROR(Status))\n            NumFound++;' in s
          assert 'GlobalConfig.DriverDirs[0] != 0' in s
          assert 'ConnectAllDriversToAllControllers();\n        else\n            ConnectFilesystemBlockDevices();' in s
          startup = s[s.index('BOOLEAN LoadDrivers(VOID)'):]
          assert startup.count('ConnectAllDriversToAllControllers();') == 1
          assert startup.count('ConnectFilesystemBlockDevices();') == 1
          assert 'IsDriver && !EFI_ERROR(Status)' in Path('refind/launch_efi.c').read_text()
          PY_BOOT_DRIVER_BINDING
          python3 - <<'PY_BOOT_DRIVER_MANIFEST'
          from pathlib import Path
          p = Path('filesystems/boot-driver-manifest.tsv')
          entries = [line.split() for line in p.read_text().splitlines()
                     if line.strip() and not line.lstrip().startswith('#')]
          assert entries
          assert all(len(row) == 3 and row[0] in ('enabled', 'disabled') for row in entries)
          assert len({row[1] for row in entries}) == len(entries)
          assert ('enabled', 'BootExt4_x64.efi', 'BootExt4') in [tuple(row) for row in entries]
          assert ('disabled', 'InfiltratorFS_x64.efi', 'InfiltratorFS') in [tuple(row) for row in entries]
          bundler = Path('scripts/build-uefi-bundle.sh').read_text()
          assert 'driver_manifest="$root/filesystems/boot-driver-manifest.tsv"' in bundler
          assert 'actual_drivers != expected_drivers' in bundler
          PY_BOOT_DRIVER_MANIFEST
          python3 - <<'PY_BOOT_LINUX_SPLASH'
          from pathlib import Path
          source = Path('refind/config.c').read_text()
          assert 'HasPlymouth' in source
          assert 'L" quiet splash"' in source
          assert r'L"\\usr\\bin\\plymouth"' in source
          assert r'L"\\usr\\sbin\\plymouthd"' in source
          assert '"ro root=%s single' in source
          PY_BOOT_LINUX_SPLASH
          python3 - <<'PY_BOOT_CONFIG_OWNERSHIP'
          from pathlib import Path
          config = Path('refind/config.c').read_text()
          linux = Path('refind/linux.c').read_text()
          scan = Path('refind/scan.c').read_text()
          header = Path('refind/config.h').read_text()
          combined = config + linux + scan + header
          for stale in ('refind_linux.conf', 'refind-linux.conf',
                        'ReadLinuxOptionsFile', 'GetFirstOptionsFromFile',
                        'LINUX_OPTIONS_FILENAMES'):
              assert stale not in combined, f'inherited Linux configuration remains: {stale}'
          assert 'GenerateLinuxOptions(IN REFIT_VOLUME *Volume)' in config
          assert 'GenerateOptionsFromEtcFstab(Volume)' in config
          assert 'GenerateOptionsFromPartTypes()' in config
          assert 'GetFirstLinuxOptions(Volume)' in linux
          assert 'GenerateLinuxOptions(Volume)' in linux
          assert 'GenerateLinuxOptions(Volume)' in scan
          assert 'Entry->Enabled = FALSE;' in config
          assert 'GenerateSubScreen(Entry, Entry->Volume, TRUE)' in config
          assert 'L"menuentry"' in config and 'L"volume"' in config
          assert 'L"loader"' in config and 'L"initrd"' in config
          assert 'L"options"' in config
          assert 'menuentry "Linux from OFS SD"' in Path('boot.conf').read_text()
          PY_BOOT_CONFIG_OWNERSHIP
          grep -q '^hideui badges hints$' boot.conf
          grep -q '^showtools reboot,shutdown,firmware$' boot.conf
          grep -q 'return EFI_WRITE_PROTECTED;' filesystems/fsw_efi.c
          test -s boot.conf
          test -s filesystems/ext4_x64.efi
          test -s filesystems/infiltratorfs_x64.efi
          mkdir -p dist
          bash scripts/build-mb-fonts.sh dist
          test -s dist/mb-corpo-s-regular.png
          test -s dist/mb-corpo-s-bold.png
          test -s dist/mb-corpo-a-cond-regular.png
          test -s dist/FONT_PROVENANCE.txt
          icons_dir="$RUNNER_TEMP/boot-icons"
          bash scripts/build-icons.sh "$icons_dir"
          test -s "$icons_dir/os_infiltratoros.png"
          test -s "$icons_dir/os_infiltrator.png"
          test -s "$icons_dir/os_infiltratorboot.png"
          test -s "$icons_dir/ICON_PROVENANCE.txt"
          test ! -e "$icons_dir/os_refind.png"
          test ! -e "$icons_dir/os_refit.png"
          bash scripts/build-theme.sh dist "$icons_dir" dist
          test -s dist/boot-banner.png
          test -s dist/boot-selection-big.png
          test -s dist/boot-selection-small.png
          test -s dist/THEME_PROVENANCE.txt
          test -s "$icons_dir/func_reset.png"
          test -s "$icons_dir/func_shutdown.png"
          test -s "$icons_dir/func_firmware.png"
          test -s "$icons_dir/os_uefi.png"
          test -s "$icons_dir/os_unknown.png"
          grep -q '^design_contract=infiltrator-design-v1$' dist/THEME_PROVENANCE.txt
          grep -q '^theme_background=#050608$' dist/THEME_PROVENANCE.txt
          grep -q '^theme_accent=#00ADEF$' dist/THEME_PROVENANCE.txt
          python3 - dist/mb-corpo-s-regular.png dist/boot-banner.png dist/boot-selection-big.png <<'PY'
          import sys
          from PIL import Image
          font = Image.open(sys.argv[1]).convert('RGBA')
          assert font.width % 96 == 0
          cell = font.width // 96
          advances = []
          for index in range(96):
              r, g, b, a = font.getpixel((index * cell, 0))
              assert (g, b, a) == (0x49, 0x42, 255), f'missing IB metric marker at glyph {index}'
              assert r > 0, f'zero glyph advance at glyph {index}'
              advances.append(r)
          assert len(set(advances)) > 8, 'MB proportional advances collapsed toward fixed-width rendering'
          opaque = [font.getpixel((x, y))
                    for y in range(1, font.height)
                    for x in range(font.width)
                    if font.getpixel((x, y))[3] > 16]
          assert opaque, 'font atlas has no visible glyph pixels'
          assert max(p[0] + p[1] + p[2] for p in opaque) < 96, 'font master must be dark for renderer contrast inversion'
          banner = Image.open(sys.argv[2]).convert('RGBA')
          assert banner.size == (640, 120)
          assert banner.getpixel((0, 0))[:3] == (5, 6, 8)
          background = banner.getpixel((0, 0))
          # The InfiltratorOS artwork must replace the wordmark, not sit
          # beside an additional 'BOOT' text glyph or metric-row artifacts.
          assert all(banner.getpixel((x, y)) == background
                     for y in range(120)
                     for x in list(range(220)) + list(range(420, 640))), 'unexpected banner text outside logo'
          assert any(banner.getpixel((x, y)) != background
                     for y in range(120) for x in range(240, 400)), 'missing InfiltratorOS artwork'
          selection = Image.open(sys.argv[3]).convert('RGBA')
          assert selection.size == (288, 288)
          PY
          cp "$icons_dir/os_infiltratoros.png" dist/os_infiltratoros.png
          cp "$icons_dir/ICON_PROVENANCE.txt" dist/ICON_PROVENANCE.txt
          cp refind/refind_x64.efi "dist/Boot-$version-x86_64.efi"
          cp filesystems/ext4_x64.efi "dist/BootExt4-$version-x86_64.efi"
          cp filesystems/infiltratorfs_x64.efi "dist/InfiltratorFS-$version-x86_64.efi"
          cp boot.conf dist/boot.conf
          bash scripts/build-uefi-bundle.sh dist "$icons_dir" "$version"
          bash packaging/build-deb.sh "dist/Boot-$version-x86_64-uefi.zip" "dist/infiltrator-boot_${version}_amd64.deb"
          test "$(dpkg-deb -f "dist/infiltrator-boot_${version}_amd64.deb" Package)" = infiltrator-boot
          test "$(dpkg-deb -f "dist/infiltrator-boot_${version}_amd64.deb" Version)" = "$version"
          test "$(dpkg-deb -f "dist/infiltrator-boot_${version}_amd64.deb" Architecture)" = amd64
          if dpkg-deb --contents "dist/infiltrator-boot_${version}_amd64.deb" | grep -qE '(THEME|FONT|ICON)_PROVENANCE[.]txt'; then
            echo "Build-only provenance must not be shipped in the Boot DEB." >&2
            exit 1
          fi
          grep -q 'infiltrator-boot-deploy' packaging/infiltrator-boot-deploy
          bash -n packaging/build-deb.sh packaging/infiltrator-boot-deploy
          test -s "dist/Boot-$version-x86_64-uefi.zip"
          python3 - "dist/Boot-$version-x86_64-uefi.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = set(z.namelist())
          assert 'EFI/BOOT/drivers_x64/BootExt4_x64.efi' in names
          assert 'EFI/BOOT/drivers_x64/InfiltratorFS_x64.efi' not in names
          assert 'EFI/BOOT/drivers-disabled/InfiltratorFS_x64.efi' in names
          assert 'EFI/BOOT/os_infiltratoros.png' in names
          assert 'EFI/BOOT/boot-banner.png' in names
          assert 'EFI/BOOT/boot-selection-big.png' in names
          assert 'EFI/BOOT/boot-selection-small.png' in names
          assert not any(name.endswith('_PROVENANCE.txt') for name in names), 'build-only provenance leaked into EFI bundle'
          assert 'EFI/BOOT/func_reset.png' in names
          assert 'EFI/BOOT/func_shutdown.png' in names
          assert 'EFI/BOOT/func_firmware.png' in names
          PY
          # Keep intermediate images, themes and the EFI test bundle in CI only.
          # A Debian product release contains exactly the installable package
          # plus its checksum. GitHub supplies source archives for the tag.
          mkdir -p release
          install -m 0644 "dist/infiltrator-boot_${version}_amd64.deb" \
              "release/infiltrator-boot_${version}_amd64.deb"
          (cd release && sha256sum "infiltrator-boot_${version}_amd64.deb" > SHA256SUMS.txt)
          python3 - "release" "infiltrator-boot_${version}_amd64.deb" <<'PY_PUBLIC_RELEASE'
          from pathlib import Path
          import sys
          names = {p.name for p in Path(sys.argv[1]).iterdir()}
          expected = {sys.argv[2], "SHA256SUMS.txt"}
          assert names == expected, f"Unexpected public Boot assets: {names ^ expected}"
          PY_PUBLIC_RELEASE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boot-release-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: boot-release-${{ github.sha }}
          path: release
      - name: Publish exact verified release bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || exit 0
          version=$(tr -d '\r\n' < VERSION)
          deb="infiltrator-boot_${version}_amd64.deb"
          # Fail closed if build artifacts accidentally leak into public output.
          expected="$(printf '%s\n' SHA256SUMS.txt "$deb" | sort)"
          actual="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          test "$(wc -l < release/SHA256SUMS.txt)" = 1
          (cd release && sha256sum -c SHA256SUMS.txt)
          test "$(dpkg-deb -f "release/$deb" Package)" = "infiltrator-boot"
          test "$(dpkg-deb -f "release/$deb" Version)" = "$version"
          test "$(dpkg-deb -f "release/$deb" Architecture)" = "amd64"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              if gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false; then
                gh release edit "$tag" --title "Boot $version" --prerelease=false --latest
                echo "$tag is already published; promoted it to a normal GitHub Release. Advance VERSION for the next product release."
                exit 0
              fi
              echo "$tag exists but does not identify this commit and has no published release."
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state"; then
            gh release create "$tag" --verify-tag --draft --title "Boot $version" --notes "Infiltrator Boot $version for x86-64 UEFI. Install the verified infiltrator-boot Debian package from the Infiltrator APT repository or download the DEB here. Its payload includes Boot, its configuration template, fonts, artwork and qualified filesystem drivers. APT installs the managed package; activation on an existing EFI System Partition is a deliberate separate operation: sudo infiltrator-boot-deploy --update-existing --confirm. This leaves the existing boot.conf, separately installed drivers and NVRAM unchanged. The EFI bundle and individual build products are validated in CI, not published as duplicate release assets. Physical firmware, Secure Boot and recovery qualification remain separate."
            gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state"
          fi
          draft=$(jq -r .isDraft "$RUNNER_TEMP/release-state")
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" release/* --clobber
          fi
          verify_remote() {
            local destination
            destination=$(mktemp -d)
            gh release download "$tag" --dir "$destination"
            diff -qr release "$destination"
            rm -rf "$destination"
          }
          verify_remote
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false --prerelease=false --latest
          else
            gh release edit "$tag" --prerelease=false --latest
          fi
          verify_remote
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
