name: Verify Boot source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boot-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnu-efi gcc make binutils
      - name: Verify pinned source and full GNU-EFI build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/vendor-infiltratorfs.sh --check
          bash -n scripts/build-gnuefi.sh
          bash scripts/build-gnuefi.sh
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          git archive --format=zip --prefix="Boot-$version/" HEAD > "dist/Boot-$version-source.zip"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          (cd dist && sha256sum *.zip SOURCE_COMMIT > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boot-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: boot-qualified-${{ github.sha }}
          path: release
      - name: Publish exact qualified bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || exit 0
          test "$(cat release/SOURCE_COMMIT)" = "$GITHUB_SHA"
          (cd release && sha256sum -c SHA256SUMS.txt)
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
              echo "$tag is already published; advance VERSION for the next product release."
              exit 0
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state"; then
            gh release create "$tag" --verify-tag --draft --prerelease --title "Boot $version source preview" --notes "Exact source preview. GNU-EFI x86-64 compilation and vendored-source identity are verified. Firmware runtime, Secure Boot and persistent installation/recovery are not qualified by this preview. No installable firmware binary is distributed."
            gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state"
          fi
          draft=$(jq -r .isDraft "$RUNNER_TEMP/release-state")
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" release/* --clobber
          fi
          verify_remote() {
            local destination
            destination=$(mktemp -d)
            gh release download "$tag" --dir "$destination"
            diff -qr release "$destination"
            rm -rf "$destination"
          }
          verify_remote
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          fi
          verify_remote
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
