name: BOOT native source installer and generic AMD64 package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Do not overlap release uploads from rapid successive main commits.
concurrency:
  group: boot-main-release
  cancel-in-progress: true

jobs:
  build-package-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check BOOT identifiers and clean packaging layout
        shell: bash
        run: |
          if git ls-files | grep -iE 're[f]ind'; then exit 1; fi
          if git grep -n -i -I -E 're[f]ind' -- .; then exit 1; fi
          if grep -RInE 'LoadDrivers\(|ConnectFilesystemDriver\(' boot --include='*.c' --include='*.h'; then
            echo "Legacy EFI driver runtime loading is prohibited" >&2
            exit 1
          fi
          if [[ -d filesystems || -d gptsync || -e BootPkg.dsc ]]; then
            echo "Vendored filesystem drivers or obsolete build system remain" >&2
            exit 1
          fi
          for legacy in debian boot.spec boot-alt.spec mkdistrib mkcdimage; do
            if [[ -e "$legacy" ]]; then
              echo "Obsolete legacy packaging remains: $legacy" >&2
              exit 1
            fi
          done
          for current in packaging/build-release.sh packaging/test-release.sh COPYING.txt; do
            test -s "$current" || exit 1
          done

      - name: Install firmware and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gnu-efi file dpkg-dev

      - name: Install disposable OVMF test tools
        run: sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dosfstools mtools gdisk

      - name: Compile BOOT with GNU-EFI
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.${GITHUB_RUN_NUMBER}"
          printf 'sbat,1,SBAT Version,sbat,1,https://github.com/rhboot/shim/blob/main/SBAT.md\nboot,1,Infiltrator-Projects,boot,%s,https://github.com/Infiltrator-Projects/Boot\n' "$version" > boot-sbat-release.csv
          make BOOT_SBAT_CSV=boot-sbat-release.csv CFLAGS="-O2 -fno-strict-aliasing -fno-tree-loop-distribute-patterns -fno-stack-protector -fshort-wchar -Wall -DBOOT_RELEASE_VERSION='L\"$version\"'" gnuefi

      - name: Check BOOT EFI binary
        run: |
          test -s boot/boot_x64.efi
          file boot/boot_x64.efi
          file boot/boot_x64.efi | grep -F 'PE32+'

      - name: Verify actual CPU-native build profile without touching firmware
        shell: bash
        run: |
          set -euo pipefail
          native_dir=$(mktemp -d)
          trap 'rm -rf -- "$native_dir"' EXIT
          git archive HEAD | tar -xf - -C "$native_dir"
          (
            cd "$native_dir"
            version="0.1.${GITHUB_RUN_NUMBER}"
            printf 'sbat,1,SBAT Version,sbat,1,https://github.com/rhboot/shim/blob/main/SBAT.md\nboot,1,Infiltrator-Projects,boot,%s,https://github.com/Infiltrator-Projects/Boot\n' "$version" > boot-sbat-release.csv
            make BOOT_SBAT_CSV=boot-sbat-release.csv CFLAGS="-O2 -march=native -mtune=native -mgeneral-regs-only -fno-stack-protector -fshort-wchar -fno-strict-aliasing -fno-tree-loop-distribute-patterns -Wall -DBOOT_RELEASE_VERSION='L\"$version\"'" gnuefi
            test -s boot/boot_x64.efi
            file boot/boot_x64.efi | grep -F 'PE32+'
          )

      - name: Build and test .run and .deb
        shell: bash
        run: |
          set -euo pipefail
          echo "VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          bash -n packaging/build-release.sh
          bash -n packaging/test-release.sh
          bash packaging/build-release.sh "0.1.${GITHUB_RUN_NUMBER}" dist
          bash packaging/test-release.sh "0.1.${GITHUB_RUN_NUMBER}" dist

      - name: Verify native installer against disposable ESP
        shell: bash
        run: bash tests/install-safety.sh

      - name: Test firmware-entry preservation with fake NVRAM
        shell: bash
        run: sudo bash tests/nvram-safety.sh

      - name: Smoke-test BOOT main menu in disposable OVMF firmware
        shell: bash
        run: bash tests/ovmf-smoke.sh

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-amd64-preview
          path: |
            dist/*.deb
            dist/*.run
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'NOTES'
          BOOT AMD64 preview build. These packages are NOT verified as
          operational boot managers. Firmware boot behaviour and Common V2
          filesystem integration remain under development.

          - Native .run: single source file boot-native-installer.run, containing
            the complete build and existing native installation flow.
            It downloads pinned BOOT sources, compiles with GNU-EFI CPU-native
            settings, and installs under /EFI/InfiltratorOS/BOOT only.
            It has no build-only mode and executes no second installer.
          - Generic AMD64 .deb: stages the generic BOOT firmware image only.
          - SHA256SUMS: verifies the two downloadable assets.

          The native .run performs the installation itself, updating the ESP and
          firmware entries. This is NOT yet validated for production UEFI
          use or Common V2 filesystem module compatibility.
          Do not execute it on a production boot environment until those
          separate qualifications have been completed.
          NOTES
          gh release create "v${VERSION}" dist/*.run dist/*.deb dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "BOOT ${VERSION} (native RUN, unverified firmware)" \
            --notes-file release-notes.txt \
            --prerelease
