name: Convert BOOT reference wallpaper to native PNG
on:
  push:
    paths:
      - '.github/workflows/boot-wallpaper-convert.yml'
permissions:
  contents: write
jobs:
  convert-wallpaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the existing detailed JPEG wallpaper pixel-for-pixel as PNG
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          convert themes/boot-luxury.jpg -alpha off -strip -define png:compression-level=9 PNG24:themes/boot-luxury.png
          test -s themes/boot-luxury.png
          git config user.name "BOOT Theme Converter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/boot-luxury.png
          if ! git diff --cached --quiet; then
            git commit -m "Make detailed BOOT wallpaper available as native PNG"
            git push origin HEAD:main
          fi
