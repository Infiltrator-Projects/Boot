name: Prepare BOOT wallpaper PNG

on:
  push:
    branches: [main]
    paths:
      - 'themes/boot-luxury.svg'
      - 'themes/render.sh'
      - '.github/workflows/precompile-wallpaper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boot-wallpaper-precompile
  cancel-in-progress: false

jobs:
  render-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install SVG converter only on the build runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Generate and validate deployable UEFI PNG
        shell: bash
        run: |
          set -euo pipefail
          bash themes/render.sh
          file themes/boot-luxury.png | grep -F 'PNG image data, 1920 x 1080'
      - name: Commit pre-rendered PNG to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add themes/boot-luxury.png
          if git diff --cached --quiet; then
            echo "Wallpaper PNG is already current."
            exit 0
          fi
          git commit -m "Bundle pre-rendered 1920x1080 BOOT wallpaper for UEFI"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Committed PNG to main."
              exit 0
            fi
          done
          echo "Could not fast-forward main with wallpaper PNG" >&2
          exit 1
