# SPDX-License-Identifier: GPL-3.0-or-later
# Isolated validation of additive Common V2 source. No release is published.
name: BOOT Common V2 development qualification
on:
  push:
    branches: [main]
    paths:
      - 'boot/common_v2_*'
      - 'tests/common_v2_*'
      - 'tests/host-common-v2-*'
      - 'tests/common-v2-*'
      - 'tests/ovmf-common-v2.sh'
      - 'packaging/**'
      - 'boot-native-installer.run'
      - '.github/workflows/common-v2-development.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  host-and-firmware-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: .common-v2
          persist-credentials: false
      - name: Install actual GNU-EFI compiler headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils gnu-efi
      - name: Verify pinned canonical Common V2 header
        shell: bash
        run: |
          test "$(git hash-object "$PWD/.common-v2/include/infiltratr/filesystem_module_v2.h")" = 90730b68a53ecf6a6e304c789501f29c17c728c7
      - name: Test ELF mapping and storage independently
        shell: bash
        run: |
          bash tests/host-common-v2-elf.sh
          bash tests/host-common-v2-storage.sh
          bash tests/host-common-v2-memory.sh
          bash tests/host-common-v2-trust.sh
          bash tests/host-common-v2-path.sh
          bash tests/host-common-v2-install.sh
      - name: Test canonical Common V2 descriptor and host
        if: always()
        shell: bash
        run: |
          export COMMON_INCLUDE_DIR="$PWD/.common-v2/include"
          test "$(git hash-object "$COMMON_INCLUDE_DIR/infiltratr/filesystem_module_v2.h")" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          bash tests/host-common-v2-module.sh
          bash tests/host-common-v2-namespace.sh
      - name: Regress existing filesystem and BOOT host tests
        if: always()
        shell: bash
        run: bash tests/host-source-regressions.sh
      - name: Compile the new UEFI storage and memory adapters against GNU-EFI
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gcc -std=gnu11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector -fshort-wchar -mno-red-zone -mgeneral-regs-only -fPIC \
            -DEFIX64 -DEFI_FUNCTION_WRAPPER -D__MAKEWITH_GNUEFI \
            -I/usr/include/efi -I/usr/include/efi/x86_64 -I/usr/include/efi/protocol \
            -I"$PWD/.common-v2/include" -Iinclude -Iboot \
            -c boot/common_v2_uefi_storage.c -o "$tmp/uefi-storage.o"
          test -s "$tmp/uefi-storage.o"
          gcc -std=gnu11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector -fshort-wchar -mno-red-zone -mgeneral-regs-only -fPIC \
            -DEFIX64 -DEFI_FUNCTION_WRAPPER -D__MAKEWITH_GNUEFI \
            -I/usr/include/efi -I/usr/include/efi/x86_64 -I/usr/include/efi/protocol \
            -Iinclude -Iboot -c boot/common_v2_uefi_memory.c -o "$tmp/uefi-memory.o"
          test -s "$tmp/uefi-memory.o"
          for source in common_v2_uefi_trust common_v2_discovery common_v2_volume; do
            gcc -std=gnu11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector -fshort-wchar -mno-red-zone -mgeneral-regs-only -fPIC \
              -DEFIX64 -DEFI_FUNCTION_WRAPPER -D__MAKEWITH_GNUEFI \
              -I/usr/include/efi -I/usr/include/efi/x86_64 -I/usr/include/efi/protocol \
              -I"$PWD/.common-v2/include" -Iinclude -Iboot -Ilibeg -Imok \
              -c "boot/$source.c" -o "$tmp/$source.o"
          done
          echo 'UEFI storage compilation is not an OVMF mount or boot qualification.'
      - name: Link actual BOOT with both EFI and Common V2 paths
        if: always()
        shell: bash
        run: |
          make COMMON_V2_INCLUDE="$PWD/.common-v2/include" gnuefi
          test -s boot/boot_x64.efi
          nm boot/boot_x64.so | grep -F 'BootV2MountVolumes'
          for driver in ext2 ext4 reiserfs iso9660 hfs btrfs; do
            test -s "drivers_x64/${driver}_x64.efi"
          done
      - name: Check out independent EXT4 firmware source
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-EXT4
          ref: 563b85674fdcdd2d7ea467ce369254bc566b319d
          path: .provider-ext4
          persist-credentials: false
      - name: Check out independent NTFS firmware source
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-NTFS
          ref: c27b4cae8dc1fc27b14fb94c7638ca81e93f886e
          path: .provider-ntfs
          persist-credentials: false
      - name: Build the actual provider firmware profiles
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends cmake e2fsprogs ntfs-3g qemu-system-x86 ovmf dosfstools mtools gdisk efitools sbsigntool openssl
          cmake -S .provider-ext4/module/firmware -B .provider-ext4-build -DCOMMON_INCLUDE_DIR="$PWD/.common-v2/include"
          cmake --build .provider-ext4-build
          cmake -S .provider-ntfs/module/firmware -B .provider-ntfs-build -DCOMMON_INCLUDE_DIR="$PWD/.common-v2/include"
          cmake --build .provider-ntfs-build
          test -s .provider-ext4-build/EXT4.so
          test -s .provider-ntfs-build/NTFS.so
          readelf -W -l -d -r .provider-ext4-build/EXT4.so
          readelf -W -l -d -r .provider-ntfs-build/NTFS.so
      - name: Read real EXT4 and NTFS media through BOOT's actual ELF loader
        shell: bash
        run: |
          export COMMON_INCLUDE_DIR="$PWD/.common-v2/include"
          export EXT4_FIRMWARE="$PWD/.provider-ext4-build/EXT4.so"
          export NTFS_FIRMWARE="$PWD/.provider-ntfs-build/NTFS.so"
          bash tests/common-v2-real-media.sh
      - name: Qualify unchanged EFI loader menu path under OVMF
        if: always()
        shell: bash
        run: bash tests/ovmf-smoke.sh
      - name: Obtain pinned Debian OVMF with modern memory attribute support
        if: always()
        shell: bash
        run: |
          curl --fail --location --retry 3 https://deb.debian.org/debian/pool/main/e/edk2/ovmf_2025.02-8+deb13u1_all.deb -o /tmp/ovmf-v2.deb
          echo '78e0d54df11fc77406cb7a0bc9a39e5bca6d1cbe06556b91d9a73491c52decdf  /tmp/ovmf-v2.deb' | sha256sum -c -
          dpkg-deb -x /tmp/ovmf-v2.deb "$RUNNER_TEMP/ovmf-v2"
          echo "BOOT_V2_OVMF_DIR=$RUNNER_TEMP/ovmf-v2/usr/share/OVMF" >> "$GITHUB_ENV"
      - name: Exercise actual signed BOOT, EFI drivers and independent SOs under OVMF
        if: always()
        shell: bash
        run: |
          export EXT4_FIRMWARE="$PWD/.provider-ext4-build/EXT4.so"
          export NTFS_FIRMWARE="$PWD/.provider-ntfs-build/NTFS.so"
          bash tests/ovmf-common-v2.sh
      - name: Boot a real signed Linux EFI-stub kernel and independent NTFS initramfs
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends busybox-static cpio
          mkdir -p "$RUNNER_TEMP/v2-kernel"
          image=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ { name=$2 } END { print name }')
          test -n "$image"
          (cd "$RUNNER_TEMP/v2-kernel" && apt-get download "linux-image-unsigned-${image#linux-image-}")
          dpkg-deb -x "$RUNNER_TEMP/v2-kernel/"linux-image-unsigned-*.deb "$RUNNER_TEMP/v2-kernel/extracted"
          export BOOT_V2_TEST_KERNEL="$RUNNER_TEMP/v2-kernel/extracted/boot/vmlinuz-${image#linux-image-}"
          test -s "$BOOT_V2_TEST_KERNEL"
          export EXT4_FIRMWARE="$PWD/.provider-ext4-build/EXT4.so"
          export NTFS_FIRMWARE="$PWD/.provider-ntfs-build/NTFS.so"
          bash tests/ovmf-common-v2.sh
      - name: Launch signed EFI application directly from native EXT4
        shell: bash
        run: |
          export EXT4_FIRMWARE="$PWD/.provider-ext4-build/EXT4.so"
          export NTFS_FIRMWARE="$PWD/.provider-ntfs-build/NTFS.so"
          export BOOT_V2_TEST_NATIVE_EXT4=1
          bash tests/ovmf-common-v2.sh
      - name: Boot signed Linux kernel and initramfs directly from native EXT4
        shell: bash
        run: |
          image=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ { name=$2 } END { print name }')
          test -n "$image"
          export BOOT_V2_TEST_KERNEL="$RUNNER_TEMP/v2-kernel/extracted/boot/vmlinuz-${image#linux-image-}"
          test -s "$BOOT_V2_TEST_KERNEL"
          export EXT4_FIRMWARE="$PWD/.provider-ext4-build/EXT4.so"
          export NTFS_FIRMWARE="$PWD/.provider-ntfs-build/NTFS.so"
          export BOOT_V2_TEST_NATIVE_EXT4=1
          bash tests/ovmf-common-v2.sh
      - name: Reject overlapping authenticated native filesystem claims under OVMF
        shell: bash
        run: |
          export EXT4_FIRMWARE="$PWD/.provider-ext4-build/EXT4.so"
          export NTFS_FIRMWARE="$PWD/.provider-ntfs-build/NTFS.so"
          export BOOT_V2_TEST_OVERLAP="$RUNNER_TEMP/overlap.so"
          gcc -std=c11 -Wall -Wextra -Werror -O2 -I"$PWD/.common-v2/include" \
            -shared -fPIC -fvisibility=hidden -ffreestanding -fno-builtin -mno-red-zone \
            -mgeneral-regs-only -fcf-protection=none -fno-stack-protector -nostdlib \
            -Wl,-Bsymbolic,-z,defs,-z,noexecstack,-z,relro,-z,now,-z,nopack-relative-relocs,-z,max-page-size=4096 \
            tests/common_v2_overlap_fixture.c -o "$BOOT_V2_TEST_OVERLAP"
          bash tests/ovmf-common-v2.sh
      - name: Build actual native RUN and generic AMD64 Debian artifacts
        if: always()
        shell: bash
        run: |
          bash packaging/build-release.sh 0.0.0 /tmp/boot-v2-package
          (cd /tmp/boot-v2-package && sha256sum -c SHA256SUMS)
          bash tests/deb-install-safety.sh /tmp/boot-v2-package/infiltrator-boot_0.0.0_amd64.deb
          bash tests/install-safety.sh
      - name: Compile installer verifier and check shell syntax
        if: always()
        shell: bash
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror packaging/common-v2-verify.c boot/common_v2_elf.c boot/common_v2_trust.c -o /tmp/common-v2-verify
          bash -n boot-native-installer.run packaging/common-v2-install.sh packaging/install-generic.sh packaging/build-release.sh

  provider-elf-compatibility:
    name: Provider ELF - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: EXT4
            revision: 563b85674fdcdd2d7ea467ce369254bc566b319d
          - name: NTFS
            revision: c27b4cae8dc1fc27b14fb94c7638ca81e93f886e
          - name: EXT2
            revision: cfdbcd92e3e8f882f0c88d714ad2b63f35c1e270
          - name: EXT3
            revision: 25167718f953b911f4f087ebedd609aef20eec42
          - name: exFAT
            revision: c9538fde968a5a2e94e852c16e6a96a2746560be
          - name: Btrfs
            revision: 08b41e156f534ae33aacb3b89bcbec59062b2be1
          - name: XFS
            revision: a6322b575ef9afba884a80d18630ca9e2d52b902
          - name: ZFS
            revision: a4d8b3a8cf349e472a83bdd493861bad10446ebd
          - name: HFS
            revision: d76c60ec038864bdc102176ad3aab6ae18833613
          - name: HFSPlus
            revision: d7140e0e389481893468b12919721ae4e4cbfc11
          - name: APFS
            revision: 183a7d563a74eaf1616ace8edcf1d10a38a9fc2b
          - name: FFS
            revision: 8bbf7f1fe31ea62111cc6afb641ae59e5f1a8c3c
          - name: Minix
            revision: 3af9d32c224c1806baef2599b8565fe9a2dcbabc
          - name: SFS
            revision: 69877273da86a5c22da8d1f9fe804d59d9da50f3
          - name: SFS2
            revision: 659c7613e1326c9515ecd42afa81ff97ec3c33b5
          - name: PFS3
            revision: 960df440cf7cbabcd996d96727a7f25e3b520eb6
          - name: UFS1
            revision: 0fcc900de768ae554fb21298706280d73353e26a
          - name: UFS2
            revision: ed5f7d74cf3b41f622ca9701f96ad4c1998bfbbf
          - name: FAT12
            revision: 197685e883ffd5edec8672e4165bdc6ca084d1fd
          - name: FAT16
            revision: d0911fecf7c1c43ff847f9cb5ba98c8ca267bb69
          - name: FAT32
            revision: fdbdaecfb6ce0cace5ebe702fe73579443ae1b79
          - name: OFS
            revision: c8714a4811c85e1a3a31b9884d9419107e1bda37
          - name: EFS
            revision: 8bfda4176127ba8fba55d793864c216d4a39530e
          - name: BFS
            revision: 6d5ae312423191df22b00cab7b5ca3bc12084b4a
          - name: QNX4
            revision: 1344ccee3033e89da11ae628b5f880bb47195e24
          - name: OMFS
            revision: af9db3e8b686bd2f82b61ef4ef80618f0cf5f9d2
          - name: QNX6
            revision: 43170886c5e41e6d2525e57a9e7535792f504f74
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: .common-v2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-${{ matrix.name }}
          ref: ${{ matrix.revision }}
          path: .provider
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.name == 'OMFS'
        with:
          repository: bcopeland/omfsprogs
          ref: e77827eb5520b3e14fa8ed1eb6516f2d998c17e4
          path: .omfs-oracle
          persist-credentials: false
      - name: Build independent provider and exercise actual BOOT ELF mapping
        shell: bash
        run: |
          set -euo pipefail
          common="$PWD/.common-v2/include"
          test "$(git hash-object "$common/infiltratr/filesystem_module_v2.h")" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          cmake -S .provider/module/firmware -B .provider-build -DCOMMON_INCLUDE_DIR="$common" -DCOMMON_SOURCE_DIR="$PWD/.common-v2"
          cmake --build .provider-build
          mapfile -t modules < <(find .provider-build -maxdepth 1 -type f -name '*.so')
          test "${#modules[@]}" = 1
          module="${modules[0]}"
          name="$(basename "$module" .so | tr '[:upper:]' '[:lower:]')"
          cc -std=c11 -Wall -Wextra -Werror -I"$common" -O2 -fno-tree-loop-distribute-patterns \
            tests/common_v2_media_test.c boot/common_v2_elf.c boot/common_v2_module.c \
            boot/common_v2_storage.c boot/common_v2_trust.c -o /tmp/provider-test
          if ! /tmp/provider-test "$module" "$name"; then
            readelf -W -h -l -d -s -r "$module"
            exit 1
          fi
          # Verify that the linked provider has no extended-register
          # instructions. The common arithmetic helper TU may contain
          # floating-point code before unused sections are discarded.
          objdump -d "$module" > /tmp/provider-disassembly
          if grep -E '(%[xyz]mm[0-9]+|%st\(|%mm[0-9]+|%k[0-7]([,[:space:]]|$))' /tmp/provider-disassembly; then
            echo 'Firmware module uses extended register state' >&2
            exit 1
          fi
          case "$name" in
            ext2|ext3) sudo apt-get install -y --no-install-recommends e2fsprogs ;;
            btrfs) sudo apt-get install -y --no-install-recommends btrfs-progs ;;
            xfs) sudo apt-get install -y --no-install-recommends xfsprogs ;;
            fat12|fat16|fat32) sudo apt-get install -y --no-install-recommends dosfstools mtools ;;
            hfs) sudo apt-get install -y --no-install-recommends hfsutils ;;
            hfsplus) sudo apt-get install -y --no-install-recommends hfsprogs ;;
            exfat) sudo apt-get install -y --no-install-recommends exfatprogs ;;
            minix|bfs) sudo apt-get install -y --no-install-recommends util-linux ;;
            qnx6)
              # Byte-authored provider fixture, not third-party media.
              cc -std=c11 -Wall -Wextra -Werror -I"$common" .provider/tests/test_qnx6.c -ldl -o /tmp/qnx6-fixture
              mkdir -p "$RUNNER_TEMP/qnx6-media"
              /tmp/qnx6-fixture --emit "$RUNNER_TEMP/qnx6-media/media.img" "$RUNNER_TEMP/qnx6-media/proof.bin"
              (cd "$RUNNER_TEMP/qnx6-media" && sha256sum media.img > before)
              for sector in 512 4096; do
                /tmp/provider-test "$module" "$name" "$RUNNER_TEMP/qnx6-media/media.img" "$RUNNER_TEMP/qnx6-media/proof.bin" /short.bin "$sector"
              done
              (cd "$RUNNER_TEMP/qnx6-media" && sha256sum -c before)
              exit 0 ;;
            omfs)
              bash .provider/tests/make-oracle-media.sh .omfs-oracle "$RUNNER_TEMP/omfs-media"
              (cd "$RUNNER_TEMP/omfs-media" && sha256sum media.img > before)
              for sector in 512 4096; do
                /tmp/provider-test "$module" "$name" "$RUNNER_TEMP/omfs-media/media.img" "$RUNNER_TEMP/omfs-media/proof.bin" /proof.bin "$sector"
              done
              (cd "$RUNNER_TEMP/omfs-media" && sha256sum -c before)
              exit 0 ;;
            *) echo "No independent media fixture yet for $name"; exit 0 ;;
          esac
          bash tests/common-v2-provider-media.sh /tmp/provider-test "$module" "$name"
      - name: Qualify provider release-target carrier payload
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.name }}"
          case "$name" in
            FAT12|FAT16|FAT32|OFS)
              sudo apt-get install -y --no-install-recommends build-essential binutils cmake git python3 dpkg-dev
              make -C .provider release
              mapfile -t packages < <(find .provider/dist -maxdepth 1 -type f -name '*.deb')
              test "${#packages[@]}" = 1
              dpkg-deb -x "${packages[0]}" /tmp/provider-package
              carrier="/tmp/provider-package/System/Filesystems/$name.so"
              ;;
            EFS|BFS)
              # actions/checkout leaves an empty directory for an uninitialised gitlink.
              # Remove only that empty directory, never an existing checkout.
              if [[ -d .provider/Libraries && ! -L .provider/Libraries ]]; then rmdir .provider/Libraries; fi
              ln -s "$PWD/.common-v2" .provider/Libraries
              test -s .provider/Libraries/include/infiltratr/filesystem_module_v2.h
              make -C .provider check
              (cd .provider && sh scripts/package.sh "$RUNNER_TEMP/provider-package")
              mapfile -t packages < <(find "$RUNNER_TEMP/provider-package" -maxdepth 1 -type f -name '*.deb')
              test "${#packages[@]}" = 1
              dpkg-deb -x "${packages[0]}" /tmp/provider-package
              carrier="/tmp/provider-package/System/Filesystems/$name.so"
              ;;
            QNX4|OMFS|QNX6)
              # actions/checkout leaves an empty directory for an uninitialised gitlink.
              # Remove only that empty directory, never an existing checkout.
              if [[ -d .provider/Libraries && ! -L .provider/Libraries ]]; then rmdir .provider/Libraries; fi
              ln -s "$PWD/.common-v2" .provider/Libraries
              test -s .provider/Libraries/include/infiltratr/filesystem_module_v2.h
              make -C .provider carrier
              carrier="$PWD/.provider/build/carrier/$name.so"
              ;;
            *)
              # Build the owner's real hosted production target, not a
              # synthetic carrier wrapped around our isolated test payload.
              # Preserve its own pinned Common dependency.
              case "$name" in
                EXT2) target=ext-ext2-driver ;;
                EXT3) target=ext-ext3-driver ;;
                EXT4) target=ext-ext4-driver ;;
                NTFS) target=ntfs-driver ;;
                exFAT) target=exfat-unified ;;
                Btrfs) target=btrfs-driver ;;
                XFS) target=xfs-driver ;;
                ZFS) target=zfs-driver ;;
                HFS) target=hfs-driver ;;
                HFSPlus) target=hfsplus-driver ;;
                APFS) target=apfs-driver ;;
                FFS) target=ffs-unified ;;
                Minix) target=minix-driver ;;
                SFS) target=sfs-driver ;;
                SFS2) target=sfs2-driver ;;
                PFS3) target=pfs3-driver ;;
                UFS1) target=ufs1-driver ;;
                UFS2) target=ufs-driver ;;
                *) exit 2 ;;
              esac
              sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev pkg-config libtool autoconf automake
              if [[ "$name" == NTFS ]]; then
                # Use the owning project's exact pinned source preparation,
                # as its own CI does, not a distribution NTFS runtime.
                sudo apt-get install -y --no-install-recommends libgcrypt20-dev
                (cd .provider && python3 -c 'from standalone import build; build.prepare_release_source()')
              fi
              cmake -S .provider -B .carrier-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
              cmake --build .carrier-build --target "$target" --parallel 2
              mapfile -t carriers < <(find .carrier-build -maxdepth 1 -type f -iname "$name.so")
              test "${#carriers[@]}" = 1
              carrier="${carriers[0]}"
              ;;
          esac
          test -s "$carrier"
          bash tests/common-v2-carrier.sh "$carrier" "$name" /tmp/provider-test
