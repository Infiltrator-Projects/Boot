# SPDX-License-Identifier: GPL-3.0-or-later
# Isolated validation of additive Common V2 source. No release is published.
name: BOOT Common V2 development qualification
on:
  push:
    branches: [main]
    paths:
      - 'boot/common_v2_*'
      - 'tests/common_v2_*'
      - 'tests/host-common-v2-*'
      - 'tests/common-v2-*'
      - 'tests/ovmf-common-v2.sh'
      - 'packaging/**'
      - 'boot-native-installer.run'
      - '.github/workflows/common-v2-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-and-firmware-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: .common-v2
          persist-credentials: false
      - name: Install actual GNU-EFI compiler headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils gnu-efi
      - name: Verify pinned canonical Common V2 header
        shell: bash
        run: |
          test "$(git hash-object "$PWD/.common-v2/include/infiltratr/filesystem_module_v2.h")" = 90730b68a53ecf6a6e304c789501f29c17c728c7
      - name: Test ELF mapping and storage independently
        shell: bash
        run: |
          bash tests/host-common-v2-elf.sh
          bash tests/host-common-v2-storage.sh
          bash tests/host-common-v2-memory.sh
          bash tests/host-common-v2-trust.sh
          bash tests/host-common-v2-path.sh
      - name: Test canonical Common V2 descriptor and host
        if: always()
        shell: bash
        run: |
          export COMMON_INCLUDE_DIR="$PWD/.common-v2/include"
          test "$(git hash-object "$COMMON_INCLUDE_DIR/infiltratr/filesystem_module_v2.h")" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          bash tests/host-common-v2-module.sh
      - name: Regress existing filesystem and BOOT host tests
        if: always()
        shell: bash
        run: bash tests/host-source-regressions.sh
      - name: Compile the new UEFI storage and memory adapters against GNU-EFI
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gcc -std=gnu11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector -fshort-wchar -mno-red-zone -mgeneral-regs-only -fPIC \
            -DEFIX64 -DEFI_FUNCTION_WRAPPER -D__MAKEWITH_GNUEFI \
            -I/usr/include/efi -I/usr/include/efi/x86_64 -I/usr/include/efi/protocol \
            -I"$PWD/.common-v2/include" -Iinclude -Iboot \
            -c boot/common_v2_uefi_storage.c -o "$tmp/uefi-storage.o"
          test -s "$tmp/uefi-storage.o"
          gcc -std=gnu11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector -fshort-wchar -mno-red-zone -mgeneral-regs-only -fPIC \
            -DEFIX64 -DEFI_FUNCTION_WRAPPER -D__MAKEWITH_GNUEFI \
            -I/usr/include/efi -I/usr/include/efi/x86_64 -I/usr/include/efi/protocol \
            -Iinclude -Iboot -c boot/common_v2_uefi_memory.c -o "$tmp/uefi-memory.o"
          test -s "$tmp/uefi-memory.o"
          for source in common_v2_uefi_trust common_v2_discovery common_v2_volume; do
            gcc -std=gnu11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector -fshort-wchar -mno-red-zone -mgeneral-regs-only -fPIC \
              -DEFIX64 -DEFI_FUNCTION_WRAPPER -D__MAKEWITH_GNUEFI \
              -I/usr/include/efi -I/usr/include/efi/x86_64 -I/usr/include/efi/protocol \
              -I"$PWD/.common-v2/include" -Iinclude -Iboot -Ilibeg -Imok \
              -c "boot/$source.c" -o "$tmp/$source.o"
          done
          echo 'UEFI storage compilation is not an OVMF mount or boot qualification.'
      - name: Link actual BOOT with both EFI and Common V2 paths
        if: always()
        shell: bash
        run: |
          make COMMON_V2_INCLUDE="$PWD/.common-v2/include" gnuefi
          test -s boot/boot_x64.efi
          nm boot/boot_x64.so | grep -F 'BootV2MountVolumes'
          for driver in ext2 ext4 reiserfs iso9660 hfs btrfs; do
            test -s "drivers_x64/${driver}_x64.efi"
          done
      - name: Check out independent EXT4 firmware source
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-EXT4
          ref: b23bbca8fc48b62be782c272fcc7190c77991671
          path: .provider-ext4
          persist-credentials: false
      - name: Check out independent NTFS firmware source
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Filesystem-NTFS
          ref: f2f8dec290bf814ccf845e088b30f5aac5f7070b
          path: .provider-ntfs
          persist-credentials: false
      - name: Build the actual provider firmware profiles
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends cmake e2fsprogs ntfs-3g qemu-system-x86 ovmf dosfstools mtools gdisk efitools sbsigntool openssl
          cmake -S .provider-ext4/module/firmware -B .provider-ext4-build -DCOMMON_INCLUDE_DIR="$PWD/.common-v2/include"
          cmake --build .provider-ext4-build
          cmake -S .provider-ntfs/module/firmware -B .provider-ntfs-build -DCOMMON_INCLUDE_DIR="$PWD/.common-v2/include"
          cmake --build .provider-ntfs-build
          test -s .provider-ext4-build/EXT4.so
          test -s .provider-ntfs-build/NTFS.so
          readelf -W -l -d -r .provider-ext4-build/EXT4.so
          readelf -W -l -d -r .provider-ntfs-build/NTFS.so
      - name: Read real EXT4 and NTFS media through BOOT's actual ELF loader
        shell: bash
        run: |
          export COMMON_INCLUDE_DIR="$PWD/.common-v2/include"
          export EXT4_FIRMWARE="$PWD/.provider-ext4-build/EXT4.so"
          export NTFS_FIRMWARE="$PWD/.provider-ntfs-build/NTFS.so"
          bash tests/common-v2-real-media.sh
      - name: Qualify unchanged EFI loader menu path under OVMF
        if: always()
        shell: bash
        run: bash tests/ovmf-smoke.sh
      - name: Exercise actual signed BOOT, EFI drivers and independent SOs under OVMF
        if: always()
        shell: bash
        run: |
          export EXT4_FIRMWARE="$PWD/.provider-ext4-build/EXT4.so"
          export NTFS_FIRMWARE="$PWD/.provider-ntfs-build/NTFS.so"
          bash tests/ovmf-common-v2.sh
      - name: Compile installer verifier and check shell syntax
        if: always()
        shell: bash
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror packaging/common-v2-verify.c boot/common_v2_elf.c boot/common_v2_trust.c -o /tmp/common-v2-verify
          bash -n boot-native-installer.run packaging/common-v2-install.sh packaging/install-generic.sh packaging/build-release.sh
