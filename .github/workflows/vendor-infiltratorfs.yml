name: Verify vendored InfiltratorFS UEFI source

on:
  pull_request:
    paths:
      - 'filesystems/infiltratorfs/vendor/**'
      - 'scripts/vendor-infiltratorfs.sh'
      - '.github/workflows/vendor-infiltratorfs.yml'
  push:
    branches:
      - main
    paths:
      - 'filesystems/infiltratorfs/vendor/**'
      - 'scripts/vendor-infiltratorfs.sh'
      - '.github/workflows/vendor-infiltratorfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infiltratorfs-vendor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reproduce pinned vendor tree
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Boot source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify exact vendored source
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/vendor-infiltratorfs.sh --check
