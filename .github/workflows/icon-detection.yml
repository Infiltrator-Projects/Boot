name: BOOT operating-system icon identification

on:
  push:
    branches: [main]
    paths:
      - 'boot/scan.c'
      - 'boot/linux.c'
      - 'tests/host-icon-detection.sh'
      - 'tests/icon-detection-regressions.c'
      - '.github/workflows/icon-detection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-icon-detection-main
  cancel-in-progress: false

jobs:
  host-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Mint, Windows, Linux, BOOT and firmware icon resources
        shell: bash
        run: |
          set -euo pipefail
          for image in os_linuxmint os_linux os_win8 os_win os_boot os_ubuntu os_uefi os_network os_unknown; do
            test -s "icons/${image}.png"
          done
      - name: Compile and test real BOOT classifier functions
        shell: bash
        run: bash tests/host-icon-detection.sh
      - name: Install the UEFI development toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnu-efi binutils
      - name: Compile BOOT with GNU-EFI and link the actual firmware application
        shell: bash
        run: |
          set -euo pipefail
          printf 'sbat,1,SBAT Version,sbat,1,https://github.com/rhboot/shim/blob/main/SBAT.md\nboot,1,Infiltrator-Projects,boot,0.0.1,https://github.com/Infiltrator-Projects/Boot\n' > boot-sbat-release.csv
          make BOOT_SBAT_CSV=boot-sbat-release.csv CFLAGS="-O2 -fno-strict-aliasing -fno-tree-loop-distribute-patterns -fno-stack-protector -fshort-wchar -Wall" gnuefi
          file boot/boot_x64.efi | grep -F 'PE32+'
